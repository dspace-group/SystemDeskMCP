[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systemdesk-mcp"
version = "0.1.0"
description = "Python MCP server for automating dSPACE SystemDesk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.1,<4",
    "pywin32==312",
    "pydantic>=2.0.0,<3",
]

[project.optional-dependencies]
dev = [
    "pylint>=4.0.0,<5",
    "pytest>=8.0.0,<9",
    "pytest-cov>=6.0.0,<7",
]

[project.scripts]
systemdesk-mcp = "systemdesk_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
